name: Android Build (Project Heartbeat + Shinobu)

# Manual trigger
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Project Heartbeat
      uses: actions/checkout@v4

    - name: Clone Shinobu Engine
      run: |
        git clone https://github.com/EIRTeam/shinobu.git shinobu

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential scons python3 pkg-config unzip

    - name: Patch Miniaudio for Android
      run: |
        sed -i '1i #include <android/log.h>' shinobu/modules/shinobu/thirdparty/miniaudio/miniaudio.h

    - name: Build Shinobu Export Template for Android
      working-directory: shinobu
      run: |
        scons platform=android target=template_debug arch=arm64v8 -j$(nproc) \
          ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT

    - name: List Shinobu Build Output
      run: ls -lh shinobu/bin

    - name: Copy Shinobu Export Templates
      run: |
        mkdir -p export/android
        cp shinobu/bin/*.so export/android/

    - name: Build Project Heartbeat APK
      working-directory: android
      run: |
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Project-Heartbeat-Android
        path: android/build/outputs/apk/debug/*.apk
